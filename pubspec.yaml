name: hostel_shop_mgmt_app
description: "H House — Comprehensive hostel living, campus shop commerce, mess attendance, and resident management system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^11.0.0
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  animate_do: ^4.2.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.0
  google_sign_in: 6.2.2
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.4
  share_plus: ^12.0.1
  flutter_local_notifications: ^18.0.1
  overlay_support: ^2.1.0
  intl: ^0.19.0
  webview_flutter: ^4.13.1
  pdf: ^3.11.3
  flutter_dotenv: ^5.2.1
  printing: ^5.14.2
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  flutter_tts: ^4.2.5
  fl_chart: ^1.2.0
  wakelock_plus: ^1.4.0
  lottie: ^3.3.2
  mobile_scanner: ^7.2.0
  table_calendar: ^3.1.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  http: ^1.6.0
  local_auth: ^3.0.1
  google_mlkit_face_detection: ^0.13.2
  camera: ^0.12.0+1
  path: ^1.9.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  on_audio_query: ^2.9.0
  youtube_explode_dart: ^3.0.5
  audio_video_progress_bar: ^2.0.3
  permission_handler: ^12.0.1
  flutter_inappwebview: ^6.1.5
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  barcode_widget: ^2.0.4
  purchases_flutter: ^8.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

dependency_overrides:
  on_audio_query_android:
    path: ./local_plugins/on_audio_query_android

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/
    - assets/audio/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
  windows:
    generate: true
    image_path: "assets/images/app_logo.png"
  macos:
    generate: true
    image_path: "assets/images/app_logo.png"